<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VISET — Reports</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;color:#1e293b}
  .v-hdr{background:linear-gradient(135deg,#1e1b4b,#312e81);padding:28px 24px;color:#fff;position:relative}
  .v-hdr h1{font-size:22px;font-weight:700}
  .v-hdr p{color:#a5b4fc;font-size:13px;margin-top:4px}
  .v-nav{background:#fff;padding:0 24px;display:flex;gap:4px;border-bottom:1px solid #e2e8f0}
  .v-nav a{padding:14px 16px;text-decoration:none;font-size:13px;font-weight:500;color:#64748b;border-bottom:2px solid transparent}
  .v-nav a.active{color:#4f46e5;border-bottom-color:#4f46e5}
  .v-body{padding:24px;max-width:1000px;margin:0 auto}
  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:12px 16px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .filter-bar select,.filter-bar input{padding:6px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;background:#fff}
  .filter-bar select{min-width:160px}
  .filter-bar input{max-width:160px}
  .filter-bar label{font-size:12px;font-weight:600;color:#374151;white-space:nowrap}
  .v-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
  .v-card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .v-card .num{font-size:26px;font-weight:700;color:#1e1b4b}
  .v-card .lbl{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .v-card .ico{font-size:22px;margin-bottom:4px}
  .v-tbl{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden;margin-bottom:24px}
  .v-tbl table{width:100%;border-collapse:collapse}
  .v-tbl th{background:#f8fafc;color:#374151;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:2px solid #e5e7eb;text-align:left}
  .v-tbl td{padding:10px 12px;border-bottom:1px solid #f1f5f9;color:#374151;font-size:13px}
  .v-tbl tr:last-child td{border-bottom:0}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .badge-green{background:#ecfdf5;color:#065f46}
  .badge-red{background:#fef2f2;color:#991b1b}
  .badge-blue{background:#eef2ff;color:#4f46e5}
  .period-btn{padding:5px 10px;border-radius:6px;border:0;font-size:11px;font-weight:600;cursor:pointer}
  .progress-bar{height:6px;border-radius:999px;background:#f1f5f9;overflow:hidden;margin-top:4px}
  .progress-fill{height:100%;border-radius:999px}
  [x-cloak]{display:none!important}
  @media(max-width:768px){.v-body{padding:16px}.v-grid{grid-template-columns:repeat(2,1fr)}}
</style>
<link rel="stylesheet" href="/css/rtl.css">
</head>
<body>
<div x-data="app()">
  <div class="v-hdr">
    <h1>📈 <span x-text="VISET.user?.display_name || VISET.__('nav.reports')"></span></h1>
    <p x-text="VISET.__('mgr.reports_sub')">Success rate reports</p>
    <button @click="VISET.toggleLang()" x-text="VISET.locale === 'en' ? 'العربية' : 'English'" style="background:none;border:0;color:#a5b4fc;font-size:12px;cursor:pointer;position:absolute;top:16px;right:24px"></button>
  </div>
  <div class="v-nav">
    <a href="/manager/dashboard.html" x-show="_ready && VISET.can('admin.dashboard')" x-text="VISET.__('nav.dashboard')">Dashboard</a>
    <a href="/manager/workflow.html" x-show="_ready && VISET.can('admin.workflow')" x-text="VISET.__('nav.workflow')">Workflow</a>
    <a href="/tickets.html" x-show="_ready && VISET.can('ticket.view')" x-text="VISET.__('nav.tickets')">Tickets</a>
    <a href="/manager/reports.html" class="active" x-show="_ready && VISET.can('reports.view')" x-text="VISET.__('nav.reports')">Reports</a>
    <a href="/" style="margin-left:auto;color:#ef4444" x-text="VISET.__('nav.logout')">← Logout</a>
  </div>
  <div class="v-body" x-cloak>
    <template x-if="!loaded">
      <div style="text-align:center;padding:40px;color:#9ca3af">Loading...</div>
    </template>
    <template x-if="loaded">
      <div>
        <div class="filter-bar">
          <label x-text="VISET.__('reports.period')">📅 Period:</label>
          <button @click="setPeriod('today')" class="period-btn" :style="period==='today'?'background:#6366f1;color:#fff':'background:#f3f4f6;color:#374151'" x-text="VISET.__('reports.today')">Today</button>
          <button @click="setPeriod('week')" class="period-btn" :style="period==='week'?'background:#6366f1;color:#fff':'background:#f3f4f6;color:#374151'" x-text="VISET.__('reports.week')">This Week</button>
          <button @click="setPeriod('month')" class="period-btn" :style="period==='month'?'background:#6366f1;color:#fff':'background:#f3f4f6;color:#374151'" x-text="VISET.__('reports.month')">This Month</button>
          <button @click="setPeriod('all')" class="period-btn" :style="period==='all'?'background:#6366f1;color:#fff':'background:#f3f4f6;color:#374151'" x-text="VISET.__('reports.all_time')">All Time</button>
          <div style="display:flex;gap:4px;align-items:center">
            <label x-text="VISET.__('reports.from')">From:</label>
            <input type="date" x-model="dateFrom" @change="loadData" style="padding:4px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:12px">
            <label x-text="VISET.__('reports.to')">To:</label>
            <input type="date" x-model="dateTo" @change="loadData" style="padding:4px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:12px">
          </div>
          <label x-text="VISET.__('reports.salesman')">👤 Salesman:</label>
          <select x-model="selectedSalesman" @change="loadData">
            <option value="" x-text="VISET.__('reports.all')">All</option>
            <template x-for="sm in salesmen" :key="sm.id">
              <option :value="sm.id" x-text="sm.display_name || sm.username"></option>
            </template>
          </select>
        </div>
        <div class="v-grid">
          <div class="v-card"><div class="ico">📊</div><div class="num" x-text="s.total"></div><div class="lbl">Total Visits</div></div>
          <div class="v-card"><div class="ico">✅</div><div class="num" style="color:#059669" x-text="s.success"></div><div class="lbl">Success</div></div>
          <div class="v-card"><div class="ico">❌</div><div class="num" style="color:#dc2626" x-text="s.not_success"></div><div class="lbl">Not Success</div></div>
          <div class="v-card"><div class="ico">🎯</div><div class="num" style="color:#6366f1" x-text="s.rate + '%'"></div><div class="lbl">Success Rate</div></div>
        </div>
        <div class="v-tbl">
          <table>
            <thead>
              <tr><th>Salesman</th><th>Visits</th><th>Success</th><th>Not Success</th><th>Rate</th></tr>
            </thead>
            <tbody>
              <template x-for="sm in data" :key="sm.id">
                <tr>
                  <td><strong x-text="sm.display_name || sm.username"></strong></td>
                  <td><span class="badge badge-blue" x-text="sm.total_visits"></span></td>
                  <td><span class="badge badge-green" x-text="sm.success_visits"></span></td>
                  <td><span class="badge badge-red" x-text="sm.not_success_visits"></span></td>
                  <td>
                    <div style="display:flex;align-items:center;gap:8px">
                      <span :style="'font-weight:700;color:' + (sm.success_rate >= 60 ? '#059669' : sm.success_rate >= 30 ? '#d97706' : '#dc2626')" x-text="sm.success_rate + '%'"></span>
                      <div class="progress-bar" style="flex:1;max-width:100px">
                        <div class="progress-fill" :style="'width:' + sm.success_rate + '%;background:' + (sm.success_rate >= 60 ? '#059669' : sm.success_rate >= 30 ? '#d97706' : '#dc2626')"></div>
                      </div>
                    </div>
                  </td>
                </tr>
              </template>
              <tr x-show="!data.length"><td colspan="5" style="text-align:center;color:#9ca3af;padding:24px">No data yet</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </template>
  </div>
</div>
<script src="/js/lang.js"></script>
<script src="/js/utils.js"></script>
<script>
function app() {
  return {
    _ready: false,
    s: { total: 0, success: 0, not_success: 0, rate: 0 },
    data: [],
    salesmen: [],
    loaded: false,
    period: 'all',
    dateFrom: '',
    dateTo: '',
    selectedSalesman: '',
    async init() {
      this._ready = VISET._permReady;
      if (!VISET._permReady) await VISET.ready;
      this._ready = true;
      if (!VISET.user || !VISET.can('reports.view')) { window.location.href = '/'; return; }
      this.loadSalesmen();
      this.loadData();
    },
    setPeriod(mode) {
      this.period = mode;
      const now = new Date();
      if (mode === 'today') {
        this.dateFrom = now.toISOString().slice(0, 10);
        this.dateTo = now.toISOString().slice(0, 10);
      } else if (mode === 'week') {
        const day = now.getDay();
        const diff = now.getDate() - day + (day === 0 ? -6 : 1);
        const mon = new Date(now.setDate(diff));
        this.dateFrom = mon.toISOString().slice(0, 10);
        this.dateTo = new Date().toISOString().slice(0, 10);
      } else if (mode === 'month') {
        this.dateFrom = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);
        this.dateTo = now.toISOString().slice(0, 10);
      } else {
        this.dateFrom = '';
        this.dateTo = '';
      }
      this.loadData();
    },
    async loadSalesmen() {
      try {
        const users = await VISET.api('users');
        this.salesmen = users.filter(u => u.role === 'salesman');
      } catch (e) { console.warn(e); }
    },
    async loadData() {
      try {
        const params = new URLSearchParams();
        if (this.dateFrom) params.set('date_from', this.dateFrom);
        if (this.dateTo) params.set('date_to', this.dateTo);
        if (this.selectedSalesman) params.set('author_id', this.selectedSalesman);
        const qs = params.toString();
        const r = await fetch(`${VISET.API_BASE}/reports/success${qs ? '?' + qs : ''}`, {
          headers: { Authorization: `Bearer ${VISET.token}` }
        });
        if (r.ok) {
          this.data = await r.json();
          this.s = {
            total: this.data.reduce((a, b) => a + b.total_visits, 0),
            success: this.data.reduce((a, b) => a + b.success_visits, 0),
            not_success: this.data.reduce((a, b) => a + b.not_success_visits, 0),
            rate: 0,
          };
          this.s.rate = this.s.total > 0 ? Math.round((this.s.success / this.s.total) * 100) : 0;
        }
        this.loaded = true;
      } catch (e) { console.warn(e); this.loaded = true; }
    },
  };
}
</script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"></script>
</body>
</html>
