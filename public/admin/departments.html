<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VISET — Departments</title>
<link rel="stylesheet" href="/css/rtl.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;color:#1e293b}
  .v-hdr{background:linear-gradient(135deg,#1e1b4b,#312e81);padding:28px 24px;color:#fff;position:relative}
  .v-hdr h1{font-size:22px;font-weight:700}
  .v-hdr p{color:#a5b4fc;font-size:13px;margin-top:4px}
  .v-nav{background:#fff;padding:0 24px;display:flex;gap:4px;border-bottom:1px solid #e2e8f0}
  .v-nav a{padding:14px 16px;text-decoration:none;font-size:13px;font-weight:500;color:#64748b;border-bottom:2px solid transparent}
  .v-nav a.active{color:#4f46e5;border-bottom-color:#4f46e5}
  .v-body{padding:24px;max-width:800px;margin:0 auto}
  .v-card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:20px;margin-bottom:16px}
  .v-field{display:block;width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;margin-bottom:10px}
  .v-field:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 2px rgba(99,102,241,.12)}
  .v-btn{display:inline-block;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;border:0;cursor:pointer;transition:all .15s}
  .v-btn-primary{background:#6366f1;color:#fff}
  .v-btn-primary:hover{background:#4f46e5}
  .v-btn-outline{background:transparent;border:1px solid #d1d5db;color:#374151}
  .v-btn-danger{background:#fee2e2;color:#991b1b}
  .v-btn-danger:hover{background:#fecaca}
  .v-msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-top:10px}
  .v-msg.success{background:#d1fae5;color:#065f46}
  .v-msg.error{background:#fee2e2;color:#991b1b}
  .v-tbl{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;margin-top:16px}
  .v-tbl table{width:100%;border-collapse:collapse}
  .v-tbl th{background:#f8fafc;color:#374151;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:12px 14px;border-bottom:2px solid #e5e7eb;text-align:left}
  .v-tbl td{padding:12px 14px;border-bottom:1px solid #f1f5f9;color:#374151;font-size:13px}
  .v-tbl tr:hover td{background:#f8fafc}
  .v-bdg{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;background:#eef2ff;color:#4f46e5}
  .v-bdg-mgr{background:#fef3c7;color:#92400e}
  [x-cloak]{display:none!important}
  .v-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100}
  .v-modal{background:#fff;border-radius:12px;padding:24px;width:90%;max-width:420px;box-shadow:0 20px 40px rgba(0,0,0,.15)}
  .v-modal h3{font-size:16px;font-weight:700;color:#1e1b4b;margin-bottom:14px}
</style>
</head>
<body>
<div x-data="deptManager()">
  <div class="v-hdr">
    <h1>🏢 <span x-text="VISET.__('admin.departments')"></span></h1>
    <p x-text="VISET.__('departments.subtitle')"></p>
    <button @click="VISET.toggleLang()" x-text="VISET.locale === 'en' ? 'العربية' : 'English'" style="background:none;border:0;color:#a5b4fc;font-size:12px;cursor:pointer;position:absolute;top:16px;right:24px"></button>
  </div>
  <div class="v-nav">
    <a href="/admin/dashboard.html" x-show="_ready && VISET.can('admin.dashboard')"><span x-text="VISET.__('nav.dashboard')"></span></a>
    <a href="/admin/workflow.html" x-show="_ready && VISET.can('admin.workflow')"><span x-text="VISET.__('nav.workflow')"></span></a>
    <a href="/admin/customers.html" x-show="_ready && VISET.can('admin.customers')"><span x-text="VISET.__('nav.customers')"></span></a>
    <a href="/admin/employees.html" x-show="_ready && VISET.can('admin.employees')"><span x-text="VISET.__('nav.employees')"></span></a>
    <a href="/admin/departments.html" class="active" x-show="_ready && VISET.can('admin.departments')"><span x-text="VISET.__('admin.departments')"></span></a>
    <a href="/admin/job-titles.html" x-show="_ready && VISET.can('admin.job_titles')"><span x-text="VISET.__('nav.job_titles')"></span></a>
    <a href="/manager/dashboard.html" style="color:#7c3aed;font-weight:600">👤 <span x-text="VISET.__('nav.manager_view')"></span></a>
    <a href="/tickets.html" x-show="_ready && VISET.can('ticket.view')"><span x-text="VISET.__('nav.tickets')"></span></a>
    <a href="/admin/reports.html" x-show="_ready && VISET.can('reports.view')"><span x-text="VISET.__('nav.reports')"></span></a>
    <a href="/" style="margin-left:auto;color:#ef4444">← <span x-text="VISET.__('nav.logout')"></span></a>
  </div>
  <div class="v-body">
    <div class="v-card">
      <h3 style="font-size:15px;font-weight:600;color:#1e1b4b;margin-bottom:12px">➕ <span x-text="VISET.__('departments.new')"></span></h3>
      <form @submit.prevent="createDept">
        <input type="text" class="v-field" x-model="form.name" :placeholder="VISET.__('departments.name_placeholder')" required>
        <textarea class="v-field" x-model="form.description" :placeholder="VISET.__('departments.desc_placeholder')" rows="2" style="resize:vertical"></textarea>
        <select class="v-field" x-model="form.manager_id">
          <option value="0">— No Manager —</option>
          <template x-for="u in users" :key="u.id">
            <option :value="u.id" x-text="(u.display_name || u.username) + ' (' + u.role + ')'"></option>
          </template>
        </select>
        <button type="submit" class="v-btn v-btn-primary" :disabled="saving"><span x-text="saving ? VISET.__('loading') : VISET.__('create')"></span></button>
        <div x-show="msg" class="v-msg" :class="msgType" x-text="msg"></div>
      </form>
    </div>
    <div class="v-tbl">
      <table>
        <thead><tr><th x-text="VISET.__('departments.name')"></th><th x-text="VISET.__('departments.description')"></th><th>Manager</th><th x-text="VISET.__('departments.employees')"></th><th></th></tr></thead>
        <tbody>
          <template x-for="d in depts" :key="d.id">
            <tr>
              <td><strong x-text="d.name"></strong></td>
              <td style="color:#6b7280;font-size:12px" x-text="d.description || '—'"></td>
              <td>
                <template x-if="d.manager_name">
                  <span class="v-bdg v-bdg-mgr">👔 <span x-text="d.manager_name"></span></span>
                </template>
                <span x-show="!d.manager_name" style="color:#9ca3af;font-size:12px">—</span>
              </td>
              <td><span class="v-bdg" x-text="d.employee_count"></span></td>
              <td style="display:flex;gap:4px">
                <button @click="openEdit(d)" style="background:none;border:0;color:#6366f1;cursor:pointer;font-weight:600" title="Edit">✏️</button>
                <button @click="deleteDept(d.id, d.name)" class="v-btn v-btn-danger" style="padding:4px 10px;font-size:11px" :title="VISET.__('delete')">✕</button>
              </td>
            </tr>
          </template>
          <tr x-show="!depts.length"><td colspan="5" style="text-align:center;color:#9ca3af" x-text="VISET.__('no_data')"></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Edit Modal -->
  <div x-cloak x-show="showEditModal" class="v-modal-overlay" @click.self="showEditModal = false">
    <div class="v-modal">
      <h3>✏️ Edit Department</h3>
      <form @submit.prevent="saveDept">
        <input type="text" class="v-field" x-model="editForm.name" placeholder="Department name" required>
        <textarea class="v-field" x-model="editForm.description" placeholder="Description" rows="2" style="resize:vertical"></textarea>
        <select class="v-field" x-model="editForm.manager_id">
          <option value="0">— No Manager —</option>
          <template x-for="u in users" :key="u.id">
            <option :value="u.id" x-text="(u.display_name || u.username) + ' (' + u.role + ')'"></option>
          </template>
        </select>
        <div style="display:flex;gap:8px">
          <button type="submit" class="v-btn v-btn-primary" :disabled="saving" x-text="saving ? '⏳ Saving...' : 'Save Changes'"></button>
          <button type="button" class="v-btn v-btn-outline" @click="showEditModal = false">Cancel</button>
        </div>
        <div x-show="msg" class="v-msg" :class="msgType" x-text="msg"></div>
      </form>
    </div>
  </div>
</div>
<script src="/js/lang.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/manager.js"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"></script>
</body>
</html>
