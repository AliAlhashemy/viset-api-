<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VISET — Users</title>
<link rel="stylesheet" href="/css/rtl.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;color:#1e293b}
  .v-hdr{background:linear-gradient(135deg,#1e1b4b,#312e81);padding:28px 24px;color:#fff;position:relative}
  .v-hdr h1{font-size:22px;font-weight:700}
  .v-hdr p{color:#a5b4fc;font-size:13px;margin-top:4px}
  .v-nav{background:#fff;padding:0 24px;display:flex;gap:4px;border-bottom:1px solid #e2e8f0}
  .v-nav a{padding:14px 16px;text-decoration:none;font-size:13px;font-weight:500;color:#64748b;border-bottom:2px solid transparent}
  .v-nav a.active{color:#4f46e5;border-bottom-color:#4f46e5}
  .v-body{padding:24px;max-width:800px;margin:0 auto}
  .v-card{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:20px;margin-bottom:16px}
  .v-field{display:block;width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;margin-bottom:10px}
  .v-field:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 2px rgba(99,102,241,.12)}
  .v-btn{display:inline-block;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;border:0;cursor:pointer;transition:all .15s}
  .v-btn-primary{background:#6366f1;color:#fff}
  .v-btn-primary:hover{background:#4f46e5}
.v-btn-outline{background:transparent;border:1px solid #d1d5db;color:#374151}
  .v-msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-top:10px}
  .v-msg.success{background:#d1fae5;color:#065f46}
  .v-msg.error{background:#fee2e2;color:#991b1b}
  .v-tbl{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;margin-top:20px}
  .v-tbl table{width:100%;border-collapse:collapse}
  .v-tbl th{background:#f8fafc;color:#374151;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:12px 14px;border-bottom:2px solid #e5e7eb;text-align:left}
  .v-tbl td{padding:12px 14px;border-bottom:1px solid #f1f5f9;color:#374151;font-size:13px}
  [x-cloak]{display:none!important}
</style>
</head>
<body>
<div x-data="userManager()">
  <div class="v-hdr">
    <h1>👤 <span x-text="VISET.__('admin.users')"></span></h1>
    <p x-text="VISET.__('users.subtitle')"></p>
    <button @click="VISET.toggleLang()" x-text="VISET.locale === 'en' ? 'العربية' : 'English'" style="background:none;border:0;color:#a5b4fc;font-size:12px;cursor:pointer;position:absolute;top:16px;right:24px"></button>
  </div>
  <div class="v-nav">
    <a href="/admin/dashboard.html" x-show="_ready && VISET.can('admin.dashboard')"><span x-text="VISET.__('nav.dashboard')"></span></a>
    <a href="/admin/customers.html" x-show="_ready && VISET.can('admin.customers')"><span x-text="VISET.__('nav.customers')"></span></a>
    <a href="/admin/users.html" class="active" x-show="_ready && VISET.can('admin.users')"><span x-text="VISET.__('admin.users')"></span></a>
    <a href="/manager/dashboard.html" style="color:#7c3aed;font-weight:600">👤 <span x-text="VISET.__('nav.manager_view')"></span></a>
    <a href="/tickets.html" x-show="_ready && VISET.can('ticket.view')"><span x-text="VISET.__('nav.tickets')"></span></a>
    <a href="/admin/reports.html" x-show="_ready && VISET.can('reports.view')"><span x-text="VISET.__('nav.reports')"></span></a>
    <a href="/" style="margin-left:auto;color:#ef4444">← <span x-text="VISET.__('nav.logout')"></span></a>
  </div>
  <div class="v-body">
    <div class="v-card">
      <h3 style="font-size:15px;font-weight:600;color:#1e1b4b;margin-bottom:12px">➕ <span x-text="VISET.__('admin.add_user')"></span></h3>
      <form @submit.prevent="createUser">
        <input type="text" class="v-field" x-model="form.username" :placeholder="VISET.__('admin.username')" required>
        <input type="email" class="v-field" x-model="form.email" :placeholder="VISET.__('admin.email')" required>
        <input type="text" class="v-field" x-model="form.display_name" :placeholder="VISET.__('admin.display_name')">
        <input type="password" class="v-field" x-model="form.password" :placeholder="VISET.__('admin.password')" required>
        <select class="v-field" x-model="form.role">
          <option value="salesman" x-text="VISET.__('users.salesman')"></option>
          <option value="admin" x-text="VISET.__('users.admin')"></option>
        </select>
        <button type="submit" class="v-btn v-btn-primary" :disabled="creating"><span x-text="creating ? VISET.__('loading') : VISET.__('admin.add_user')"></span></button>
        <div x-show="userMessage && !showEditModal" class="v-msg" :class="userMessageType" x-text="userMessage"></div>
      </form>
    </div>

    <div class="v-card" x-show="showEditModal" style="border:2px solid #6366f1">
      <h3 style="font-size:15px;font-weight:600;color:#1e1b4b;margin-bottom:12px">✏️ <span x-text="VISET.__('admin.edit_user')"></span></h3>
      <form @submit.prevent="saveUser">
        <input type="text" class="v-field" x-model="editForm.display_name" :placeholder="VISET.__('admin.display_name')" required>
        <input type="email" class="v-field" x-model="editForm.email" :placeholder="VISET.__('admin.email')" required>
        <select class="v-field" x-model="editForm.role">
          <option value="salesman" x-text="VISET.__('users.salesman')"></option>
          <option value="admin" x-text="VISET.__('users.admin')"></option>
        </select>
        <input type="password" class="v-field" x-model="editForm.password" :placeholder="VISET.__('users.new_password')">
        <div style="display:flex;gap:8px">
          <button type="submit" class="v-btn v-btn-primary" :disabled="creating"><span x-text="creating ? VISET.__('loading') : VISET.__('save')"></span></button>
          <button type="button" class="v-btn v-btn-outline" @click="closeEdit" x-text="VISET.__('cancel')"></button>
        </div>
        <div x-show="userMessage" class="v-msg" :class="userMessageType" x-text="userMessage"></div>
      </form>
    </div>

    <div class="v-tbl">
      <table>
        <thead><tr><th x-text="VISET.__('admin.display_name')"></th><th x-text="VISET.__('admin.username')"></th><th x-text="VISET.__('admin.email')"></th><th x-text="VISET.__('admin.role')"></th><th x-text="VISET.__('mgr.visits')"></th><th></th></tr></thead>
        <tbody>
          <template x-for="u in users" :key="u.id">
            <tr>
              <td><strong x-text="u.display_name"></strong></td>
              <td x-text="u.username"></td>
              <td x-text="u.email"></td>
              <td><span style="display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600" :style="u.role==='admin'?'background:#eef2ff;color:#4f46e5':'background:#f3f4f6;color:#374151'" x-text="u.role"></span></td>
              <td x-text="u.visit_count"></td>
              <td><button @click="openEdit(u)" style="background:none;border:0;color:#6366f1;cursor:pointer;font-size:13px;font-weight:600" :title="VISET.__('edit')">✏️</button></td>
            </tr>
          </template>
          <tr x-show="!users.length"><td colspan="6" style="text-align:center;color:#9ca3af" x-text="VISET.__('no_data')"></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script src="/js/lang.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/manager.js"></script>
<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('userManager', () => ({
    _ready: false,
    users: [],
    form: { username: '', email: '', display_name: '', password: '', role: 'salesman' },
    editForm: { id: 0, display_name: '', email: '', role: 'salesman', password: '' },
    creating: false,
    userMessage: '',
    userMessageType: '',
    showEditModal: false,
    async init() {
      this._ready = VISET._permReady;
      if (!VISET._permReady) await VISET.ready;
      this._ready = true;
      if (!VISET.can('admin.users')) { window.location.href = '/'; return; }
      await this.load();
    },
    async load() {
      try { this.users = await VISET.api('users'); } catch (e) { this.userMessage = 'Load failed'; this.userMessageType = 'error'; }
    },
    async createUser() {
      if (!this.form.username || !this.form.email || !this.form.password) { this.userMessage = 'Username, email, password required'; this.userMessageType = 'error'; return; }
      this.creating = true; this.userMessage = '';
      try {
        const r = await fetch(VISET.API_BASE + '/users', { method: 'POST', headers: { Authorization: 'Bearer ' + VISET.token, 'Content-Type': 'application/json' }, body: JSON.stringify(this.form) });
        const d = await r.json();
        if (r.ok) { this.userMessage = 'User created'; this.userMessageType = 'success'; this.form = { username: '', email: '', display_name: '', password: '', role: 'salesman' }; this.load(); }
        else { this.userMessage = d.error || 'Failed'; this.userMessageType = 'error'; }
      } catch (e) { this.userMessage = 'Connection error'; this.userMessageType = 'error'; }
      this.creating = false;
    },
    openEdit(u) {
      this.editForm = { id: u.id, display_name: u.display_name || '', email: u.email || '', role: u.role || 'salesman', password: '' };
      this.showEditModal = true; this.userMessage = '';
    },
    async saveUser() {
      if (!this.editForm.display_name || !this.editForm.email) { this.userMessage = 'Name and email required'; this.userMessageType = 'error'; return; }
      this.creating = true; this.userMessage = '';
      try {
        const body = { display_name: this.editForm.display_name, email: this.editForm.email, role: this.editForm.role };
        if (this.editForm.password) body.password = this.editForm.password;
        const r = await fetch(VISET.API_BASE + '/users/' + this.editForm.id, { method: 'PUT', headers: { Authorization: 'Bearer ' + VISET.token, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const d = await r.json();
        if (r.ok) { this.userMessage = 'User updated'; this.userMessageType = 'success'; this.closeEdit(); this.load(); }
        else { this.userMessage = d.error || 'Update failed'; this.userMessageType = 'error'; }
      } catch (e) { this.userMessage = 'Connection error'; this.userMessageType = 'error'; }
      this.creating = false;
    },
    closeEdit() {
      this.showEditModal = false;
      this.editForm = { id: 0, display_name: '', email: '', role: 'salesman', password: '' };
      this.userMessage = '';
    },
  }));
});
</script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"></script>
</body>
</html>
