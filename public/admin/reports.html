<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VISET — Reports</title>
<link rel="stylesheet" href="/css/rtl.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;color:#1e293b}
  .v-hdr{background:linear-gradient(135deg,#1e1b4b,#312e81);padding:28px 24px;color:#fff;position:relative}
  .v-hdr h1{font-size:22px;font-weight:700}
  .v-hdr p{color:#a5b4fc;font-size:13px;margin-top:4px}
  .v-nav{background:#fff;padding:0 24px;display:flex;gap:4px;border-bottom:1px solid #e2e8f0}
  .v-nav a{padding:14px 16px;text-decoration:none;font-size:13px;font-weight:500;color:#64748b;border-bottom:2px solid transparent}
  .v-nav a.active{color:#4f46e5;border-bottom-color:#4f46e5}
  .v-body{padding:24px;max-width:800px;margin:0 auto}
  .v-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
  .v-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .v-card .num{font-size:28px;font-weight:700;color:#1e1b4b}
  .v-card .lbl{font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
  .v-card .ico{font-size:24px;margin-bottom:6px}
  .v-btn{display:inline-block;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;border:0;cursor:pointer;text-decoration:none;transition:all .15s}
  .v-btn-primary{background:#6366f1;color:#fff}
  .v-btn-primary:hover{background:#4f46e5}
  .v-btn-success{background:#059669;color:#fff}
  .v-btn-success:hover{background:#047857}
  .v-tbl{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
  .v-tbl table{width:100%;border-collapse:collapse}
  .v-tbl th{background:#f8fafc;color:#374151;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:12px 14px;border-bottom:2px solid #e5e7eb;text-align:left}
  .v-tbl td{padding:12px 14px;border-bottom:1px solid #f1f5f9;color:#374151;font-size:13px}
  [x-cloak]{display:none!important}
</style>
</head>
<body>
<div x-data="{ _ready: VISET._permReady, s: { total_visits: 0, pending: 0, approved: 0, flagged: 0, salesmen: [] } }" x-init="if (!VISET._permReady) VISET.ready.then(() => { _ready = true; }); (async () => { if (!VISET.can('reports.view')) { window.location.href = '/'; return; } try { s = await VISET.api('reports/summary'); } catch(e){} })()">
  <div class="v-hdr">
    <h1>📈 <span x-text="VISET.__('nav.reports')"></span></h1>
    <p x-text="VISET.__('reports.subtitle')"></p>
    <button @click="VISET.toggleLang()" x-text="VISET.locale === 'en' ? 'العربية' : 'English'" style="background:none;border:0;color:#a5b4fc;font-size:12px;cursor:pointer;position:absolute;top:16px;right:24px"></button>
  </div>
  <div class="v-nav">
    <a href="/admin/dashboard.html" x-show="_ready && VISET.can('admin.dashboard')"><span x-text="VISET.__('nav.dashboard')"></span></a>
    <a href="/admin/workflow.html" x-show="_ready && VISET.can('admin.workflow')"><span x-text="VISET.__('nav.workflow')"></span></a>
    <a href="/admin/customers.html" x-show="_ready && VISET.can('admin.customers')"><span x-text="VISET.__('nav.customers')"></span></a>
    <a href="/admin/employees.html" x-show="_ready && VISET.can('admin.employees')"><span x-text="VISET.__('nav.employees')"></span></a>
    <a href="/admin/departments.html" x-show="_ready && VISET.can('admin.departments')"><span x-text="VISET.__('nav.departments')"></span></a>
    <a href="/admin/job-titles.html" x-show="_ready && VISET.can('admin.job_titles')"><span x-text="VISET.__('nav.job_titles')"></span></a>
    <a href="/manager/dashboard.html" style="color:#7c3aed;font-weight:600">👤 <span x-text="VISET.__('nav.manager_view')"></span></a>
    <a href="/tickets.html" x-show="_ready && VISET.can('ticket.view')"><span x-text="VISET.__('nav.tickets')"></span></a>
    <a href="/admin/reports.html" class="active" x-show="_ready && VISET.can('reports.view')"><span x-text="VISET.__('nav.reports')"></span></a>
    <a href="/" style="margin-left:auto;color:#ef4444">← <span x-text="VISET.__('nav.logout')"></span></a>
  </div>
  <div class="v-body">
    <div class="v-grid" x-cloak>
      <div class="v-card"><div class="ico">📊</div><div class="num" x-text="s.total_visits"></div><div class="lbl" x-text="VISET.__('mgr.total_visits')"></div></div>
      <div class="v-card"><div class="ico">⏳</div><div class="num" x-text="s.pending"></div><div class="lbl" x-text="VISET.__('status.pending')"></div></div>
      <div class="v-card"><div class="ico">✅</div><div class="num" x-text="s.approved"></div><div class="lbl" x-text="VISET.__('status.approved')"></div></div>
      <div class="v-card"><div class="ico">🚩</div><div class="num" x-text="s.flagged"></div><div class="lbl" x-text="VISET.__('status.flagged')"></div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <a href="javascript:void(0)" @click="window.open(`/api/customers/template`, '_blank')" class="v-btn v-btn-primary">📥 <span x-text="VISET.__('reports.customer_template')"></span></a>
      <a href="javascript:void(0)" @click="window.open(`/api/reports/visits`, '_blank')" class="v-btn v-btn-success">📤 <span x-text="VISET.__('reports.export_visits')"></span></a>
    </div>
    <div class="v-tbl" x-cloak>
      <table>
        <thead><tr><th x-text="VISET.__('mgr.salesman')"></th><th x-text="VISET.__('mgr.visits')"></th></tr></thead>
        <tbody>
          <template x-for="sm in s.salesmen" :key="sm.id">
            <tr>
              <td><strong x-text="sm.display_name || sm.username"></strong></td>
              <td><span style="display:inline-block;padding:2px 10px;border-radius:999px;background:#eef2ff;color:#4f46e5;font-size:12px;font-weight:600" x-text="sm.visit_count"></span></td>
            </tr>
          </template>
          <tr x-show="!s.salesmen.length"><td colspan="2" style="text-align:center;color:#9ca3af" x-text="VISET.__('no_data')"></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script src="/js/lang.js"></script>
<script src="/js/utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"></script>
</body>
</html>
