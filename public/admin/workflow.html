<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>VISET — Workflow</title>
<link rel="stylesheet" href="/css/rtl.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;color:#1e293b;overflow-x:hidden}
  .v-hdr{background:linear-gradient(135deg,#1e1b4b,#312e81);padding:28px 24px;color:#fff;position:relative}
  .v-hdr h1{font-size:22px;font-weight:700}
  .v-hdr p{color:#a5b4fc;font-size:13px;margin-top:4px}
  .v-nav{background:#fff;padding:0 24px;display:flex;gap:4px;border-bottom:1px solid #e2e8f0;overflow-x:auto}
  .v-nav a{padding:14px 16px;text-decoration:none;font-size:13px;font-weight:500;color:#64748b;border-bottom:2px solid transparent;white-space:nowrap}
  .v-nav a.active{color:#4f46e5;border-bottom-color:#4f46e5}
  .v-body{padding:20px 16px;max-width:1400px;margin:0 auto}
  .wf-table{width:100%;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .wf-table table{width:100%;border-collapse:collapse;font-size:13px}
  .wf-table th{background:#f8fafc;color:#475569;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;text-align:left;border-bottom:2px solid #e2e8f0}
  .wf-table td{padding:10px 12px;border-bottom:1px solid #f1f5f9;color:#1e293b}
  .wf-table tr:hover td{background:#f8fafc}
  .wf-table tr{cursor:pointer}
  .wf-status-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600}
  .wf-btn-complete{padding:5px 14px;border:0;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;background:#059669;color:#fff;transition:background .15s}
  .wf-btn-complete:hover{background:#047857}
  .wf-btn-complete:disabled{opacity:.5;cursor:not-allowed}
  .wf-tabs{display:flex;gap:4px;margin-bottom:14px}
  .wf-tab{padding:8px 18px;border-radius:8px;border:0;font-size:13px;font-weight:600;cursor:pointer;background:#f1f5f9;color:#64748b;transition:all .15s}
  .wf-tab.active{background:#4f46e5;color:#fff}
  .wf-tab:hover:not(.active){background:#e2e8f0}
  .wf-empty{text-align:center;padding:40px 20px;color:#9ca3af;font-size:13px}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal-content{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .modal-hdr h2{font-size:18px;font-weight:700;color:#1e1b4b}
  .modal-close{background:none;border:0;font-size:22px;color:#9ca3af;cursor:pointer;padding:4px}
  .modal-section{margin-bottom:16px}
  .modal-section-title{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .modal-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
  .modal-info div{padding:6px 0}
  .modal-info .lbl{color:#6b7280;font-size:11px}
  .modal-info .val{font-weight:500;color:#1e293b}
  .wf-action-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:0;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;margin-right:6px;margin-bottom:6px}
  .wf-log{font-size:12px}
  .wf-log-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9}
  .wf-log-dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0}
  .wf-log-content{flex:1}
  .wf-log-action{font-weight:600;color:#1e293b}
  .wf-log-user{color:#6366f1;font-size:11px}
  .wf-log-note{color:#6b7280;font-size:11px;margin-top:2px;background:#f9fafb;padding:4px 8px;border-radius:4px}
  .wf-log-date{color:#9ca3af;font-size:10px;margin-top:2px}
  .wf-transition-note{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;margin-bottom:8px;resize:vertical;min-height:40px}
  .wf-transition-note:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 2px rgba(99,102,241,.12)}
  .wf-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  @media(max-width:768px){.wf-board{flex-direction:column;overflow-x:visible}.wf-col{flex:1;min-width:auto;max-height:none}.modal-content{margin:16px;border-radius:12px}.modal-info{grid-template-columns:1fr}}
</style>
</head>
<body>
<div x-data="workflowBoard()">
  <div class="v-hdr">
    <h1>⚡ <span x-text="VISET.__('nav.workflow')"></span> <span x-text="VISET.__('mgr.board')"></span></h1>
    <p><span x-text="VISET.__('mgr.welcome')"></span><span x-text="VISET.user?.display_name || VISET.__('mgr.user')" style="color:#a5b4fc;font-weight:600"></span><span x-text="VISET.__('workflow.subtitle')"></span></p>
    <button @click="VISET.toggleLang()" x-text="VISET.locale === 'en' ? 'العربية' : 'English'" style="background:none;border:0;color:#a5b4fc;font-size:12px;cursor:pointer;position:absolute;top:16px;right:24px"></button>
  </div>
  <div class="v-nav">
    <a href="/admin/dashboard.html" x-show="_ready && VISET.can('admin.dashboard')"><span x-text="VISET.__('nav.dashboard')"></span></a>
    <a href="/admin/workflow.html" class="active" x-show="_ready && VISET.can('admin.workflow')"><span x-text="VISET.__('nav.workflow')"></span></a>
    <a href="/manager/dashboard.html" style="color:#7c3aed;font-weight:600">👤 <span x-text="VISET.__('nav.manager_view')"></span></a>
    <a href="/admin/customers.html" x-show="_ready && VISET.can('admin.customers')"><span x-text="VISET.__('nav.customers')"></span></a>
    <a href="/admin/employees.html" x-show="_ready && VISET.can('admin.employees')"><span x-text="VISET.__('nav.employees')"></span></a>
    <a href="/admin/departments.html" x-show="_ready && VISET.can('admin.departments')"><span x-text="VISET.__('nav.departments')"></span></a>
    <a href="/admin/job-titles.html" x-show="_ready && VISET.can('admin.job_titles')"><span x-text="VISET.__('nav.job_titles')"></span></a>
    <a href="/tickets.html" x-show="_ready && VISET.can('ticket.view')"><span x-text="VISET.__('nav.tickets')"></span></a>
    <a href="/admin/reports.html" x-show="_ready && VISET.can('reports.view')"><span x-text="VISET.__('nav.reports')"></span></a>
    <a href="/" style="margin-left:auto;color:#ef4444">← <span x-text="VISET.__('nav.logout')"></span></a>
  </div>
  <div class="v-body">
    <!-- Task Filter -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:12px 16px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)">
      <label style="font-size:12px;font-weight:600;color:#374151;white-space:nowrap">🎯 <span x-text="VISET.__('mgr.filter_by_task')"></span>:</label>
      <select x-model="selectedTask" @change="loadBoard" style="padding:6px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;background:#fff;min-width:160px">
        <option value=""><span x-text="VISET.__('mgr.all_tasks')"></span></option>
        <template x-for="t in taskTypes" :key="t">
          <option :value="t" x-text="t"></option>
        </template>
      </select>
      <input x-model="searchQuery" @input.debounce="loadBoard" type="text" :placeholder="VISET.__('mgr.search_customer')" style="padding:6px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;flex:1;min-width:160px;max-width:280px">
      <button @click="clearFilter" x-show="selectedTask || searchQuery" style="padding:6px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:12px;background:#fff;color:#ef4444;cursor:pointer;font-weight:600">✕ <span x-text="VISET.__('mgr.clear')"></span></button>
    </div>
    <!-- Status Tabs -->
    <div class="wf-tabs">
      <button class="wf-tab" :class="activeTab === 'pending' ? 'active' : ''" @click="activeTab = 'pending'" x-text="'🆕 Pending (' + pendingVisits.length + ')'"></button>
      <button class="wf-tab" :class="activeTab === 'completed' ? 'active' : ''" @click="activeTab = 'completed'" x-text="'✅ Completed (' + completedVisits.length + ')'"></button>
    </div>

    <!-- Table View -->
    <div class="wf-table" x-cloak>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Customer</th>
            <th>👤 Salesman</th>
            <th>🎯 Task</th>
            <th>Status</th>
            <th>📅 Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="v in (activeTab === 'pending' ? pendingVisits : completedVisits)" :key="v.id">
            <tr @click="openDetail(v)">
              <td style="color:#9ca3af;font-weight:600" x-text="'#' + v.id"></td>
              <td style="font-weight:600;color:#1e1b4b" x-text="v.customer_name"></td>
              <td x-text="v.author_name"></td>
              <td><span style="display:inline-block;padding:1px 8px;border-radius:999px;font-size:10px;font-weight:600;background:#f3f4f6;color:#374151" x-text="v.visit_task || 'visit'"></span></td>
              <td><span class="wf-status-badge" :style="'background:' + (getStateInfo(v.status)?.color + '20' || '#f3f4f6') + ';color:' + (getStateInfo(v.status)?.color || '#6b7280')" x-text="getStateInfo(v.status)?.label || v.status"></span></td>
              <td style="color:#64748b;font-size:12px" x-text="new Date(v.created_at).toLocaleDateString()"></td>
              <td>
                <button class="wf-btn-complete" x-show="v.status === 'pending'" @click.stop="openDetail(v)" x-text="'Complete →'"></button>
                <span x-show="v.status === 'completed'" style="font-size:11px;color:#9ca3af">✔ Done</span>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
      <div class="wf-empty" x-show="(activeTab === 'pending' ? pendingVisits : completedVisits).length === 0" x-text="VISET.__('workflow.no_visits') || 'No visits found'"></div>
    </div>

    <!-- Detail Modal -->
    <div x-show="showModal" class="modal-overlay" @click.away="showModal = false" style="display:flex" :style="showModal ? '' : 'display:none'">
      <div class="modal-content" @click.stop>
        <div class="modal-hdr">
          <h2 x-text="selected?.customer_name || 'Visit'"></h2>
          <button @click="showModal = false" class="modal-close">✕</button>
        </div>

        <div class="modal-section">
          <div class="modal-info">
            <div><div class="lbl" x-text="VISET.__('mgr.salesman')"></div><div class="val" x-text="selected?.author_name"></div></div>
            <div><div class="lbl" x-text="VISET.__('mgr.status')"></div><div class="val" :style="'color:' + (getStateInfo(selected?.status)?.color || '#6b7280')" x-text="getStateInfo(selected?.status)?.label || selected?.status"></div></div>
            <div><div class="lbl" x-text="VISET.__('mgr.task')"></div><div class="val" x-text="selected?.visit_task || 'visit'"></div></div>
            <div><div class="lbl" x-text="VISET.__('mgr.department')"></div><div class="val" x-text="selected?.department_name || '—'"></div></div>
            <div x-show="selected?.customer_id"><div class="lbl" x-text="VISET.__('mgr.customer_id')"></div><div class="val" x-text="selected?.customer_id"></div></div>
            <div><div class="lbl" x-text="VISET.__('mgr.date')"></div><div class="val" x-text="new Date(selected?.created_at).toLocaleDateString()"></div></div>
          </div>
          <div x-show="selected?.visit_purpose" style="margin-top:8px;padding:8px 10px;background:#fef3c7;border-radius:6px;font-size:12px;color:#92400e"><strong x-text="VISET.__('mgr.purpose')"></strong>: <span x-text="selected?.visit_purpose"></span></div>
          <div x-show="selected?.visit_note" style="margin-top:4px;padding:8px 10px;background:#f3f4f6;border-radius:6px;font-size:12px;color:#374151"><strong x-text="VISET.__('mgr.note')"></strong>: <span x-text="selected?.visit_note"></span></div>
          <div x-show="selected?.photo_url" style="margin-top:6px">
            <img :src="selected.photo_url" style="max-width:100%;border-radius:8px;max-height:200px">
          </div>
          <div x-show="selected?.latitude" style="margin-top:8px">
            <div class="modal-section-title">📍 <span x-text="VISET.__('mgr.location')"></span></div>
            <div style="font-size:11px;color:#6b7280;margin-bottom:4px" x-text="selected?.latitude + ', ' + selected?.longitude"></div>
            <iframe
              :src="'https://www.openstreetmap.org/export/embed.html?bbox=' + (selected.longitude - 0.01) + ',' + (selected.latitude - 0.01) + ',' + (selected.longitude + 0.01) + ',' + (selected.latitude + 0.01) + '&layer=mapnik&marker=' + selected.latitude + ',' + selected.longitude"
              style="width:100%;height:150px;border-radius:8px;border:1px solid #e5e7eb"
              loading="lazy"
              :title="VISET.__('mgr.map')">
            </iframe>
          </div>
          <div x-show="!selected?.latitude && selected?.address" style="margin-top:6px;padding:8px 10px;background:#f3f4f6;border-radius:6px;font-size:12px;color:#374151"><strong x-text="VISET.__('mgr.address')"></strong>: <span x-text="selected?.address"></span></div>
        </div>

        <div class="modal-section" x-show="selected">
          <div class="modal-section-title">🎯 <span x-text="VISET.__('mgr.success') || 'Visit Outcome'"></span></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="wf-action-btn" :style="'background:' + (selected?.is_success === 1 ? '#05966920' : '#f3f4f6') + ';color:' + (selected?.is_success === 1 ? '#059669' : '#6b7280')" @click="markSuccess(1)">✅ <span x-text="VISET.__('mgr.success') || 'Success'"></span></button>
            <button class="wf-action-btn" :style="'background:' + (selected?.is_success === 0 ? '#dc262620' : '#f3f4f6') + ';color:' + (selected?.is_success === 0 ? '#dc2626' : '#6b7280')" @click="markSuccess(0)">❌ <span x-text="VISET.__('mgr.not_success') || 'Not Success'"></span></button>
            <button class="wf-action-btn" style="background:#f3f4f6;color:#6b7280" @click="markSuccess(null)">↺ <span x-text="VISET.__('mgr.clear') || 'Clear'"></span></button>
          </div>
          <div x-show="selected?.is_success !== null" style="margin-top:6px;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600" :style="selected?.is_success === 1 ? 'background:#ecfdf5;color:#065f46' : selected?.is_success === 0 ? 'background:#fef2f2;color:#991b1b' : ''" x-text="selected?.is_success === 1 ? (VISET.__('mgr.success') || 'Success') + ' ✓' : selected?.is_success === 0 ? (VISET.__('mgr.not_success') || 'Not Success') + ' ✗' : ''"></div>
        </div>

        <div class="modal-section" x-show="allowedTransitions.length">
          <div class="modal-section-title">⚡ <span x-text="VISET.__('workflow.move_to')"></span></div>
          <div class="wf-actions">
            <button class="wf-action-btn" style="background:#05966920;color:#059669" x-show="selected?.status === 'pending'" @click="transitionTo('completed')">
              ✅ Complete →
            </button>
            <button class="wf-action-btn" style="background:#d9770620;color:#d97706" x-show="selected?.status === 'completed'" @click="transitionTo('pending')">
              ↺ Reopen
            </button>
          </div>
          <textarea class="wf-transition-note" x-model="transitionNote" :placeholder="VISET.__('workflow.add_note')"></textarea>
          <div class="wf-error" x-show="transitionError" x-text="transitionError" style="color:#dc2626;font-size:12px;margin-top:6px;padding:6px 10px;background:#fef2f2;border-radius:6px;"></div>
        </div>

        <!-- Opening Task Documents -->
        <div class="modal-section" x-show="selected?.visit_task === 'opening' && selectedDocs.length">
          <div class="modal-section-title">📁 <span x-text="VISET.__('workflow.new_customer_docs')"></span></div>
          <template x-for="doc in selectedDocs" :key="doc.id">
            <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#ecfeff;border-radius:8px;margin-top:6px;font-size:12px;border:1px solid #0891b2">
              <span>📄</span>
              <a :href="doc.file_url" target="_blank" style="color:#0891b2;text-decoration:underline;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span x-text="'[' + (doc.doc_type || VISET.__('workflow.file')) + '] ' + doc.original_name"></span></a>
              <span x-text="(doc.file_size / 1024).toFixed(0) + 'KB'" style="color:#9ca3af;flex-shrink:0"></span>
            </div>
            <div x-show="isImageDoc(doc)" style="margin-top:4px">
              <img :src="doc.file_url" style="max-width:100%;max-height:180px;border-radius:6px;border:1px solid #0891b2;cursor:pointer" @click="window.open(doc.file_url, '_blank')">
            </div>
          </template>
        </div>

        <!-- All Documents -->
        <div class="modal-section" x-show="selectedDocs.length">
          <div class="modal-section-title">📎 <span x-text="VISET.__('workflow.all_documents')"></span></div>
          <template x-for="doc in selectedDocs" :key="doc.id">
            <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8fafc;border-radius:8px;margin-top:6px;font-size:12px;border:1px solid #e2e8f0">
              <span>📄</span>
              <a :href="doc.file_url" target="_blank" style="color:#6366f1;text-decoration:underline;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="(doc.doc_type ? '[' + doc.doc_type + '] ' : '') + doc.original_name"></a>
              <span x-text="(doc.file_size / 1024).toFixed(0) + 'KB'" style="color:#9ca3af;flex-shrink:0"></span>
            </div>
            <div x-show="isImageDoc(doc)" style="margin-top:4px">
              <img :src="doc.file_url" style="max-width:100%;max-height:180px;border-radius:6px;border:1px solid #e2e8f0;cursor:pointer" @click="window.open(doc.file_url, '_blank')">
            </div>
          </template>
        </div>

        <!-- Branch Tasks -->
        <div class="modal-section">
          <div class="modal-section-title">🌿 Branch Tasks</div>
          <template x-for="st in selected?.sub_tasks || []" :key="st.id">
            <div style="display:flex;align-items:center;gap:6px;padding:6px 8px;background:#f8fafc;border-radius:6px;margin-top:4px;font-size:11px;border-left:3px solid #cbd5e1;cursor:pointer" @click="openDetail(st)">
              <span x-text="st.visit_task === 'followup' ? '📞' : st.visit_task === 'demo' ? '📱' : st.visit_task === 'payment' ? '💰' : st.visit_task === 'callback' ? '🔙' : '🛒'"></span>
              <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500" x-text="st.customer_name"></span>
              <span class="wf-card-sub-status" :style="'background:' + (getStateInfo(st.status)?.color + '20' || '#f3f4f6') + ';color:' + (getStateInfo(st.status)?.color || '#6b7280')" x-text="st.status"></span>
            </div>
          </template>
          <div x-show="!(selected?.sub_tasks || []).length" style="font-size:11px;color:#9ca3af;padding:4px 0">No branch tasks yet</div>
          <button @click="showBranchForm = !showBranchForm" style="margin-top:6px;padding:6px 12px;background:#f0fdf4;color:#065f46;border:1px dashed #86efac;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer">➕ Add Branch Task</button>
          <div x-show="showBranchForm" x-cloak style="margin-top:8px;padding:10px;background:#f0fdf4;border-radius:8px;border:1px solid #86efac">
            <div style="font-size:12px;font-weight:600;color:#065f46;margin-bottom:6px">🌿 New Branch Task</div>
            <select x-model="branchTaskType" style="width:100%;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:11px;margin-bottom:6px">
              <option value="followup">📞 Follow-up</option>
              <option value="demo">📱 Demo</option>
              <option value="payment">💰 Payment</option>
              <option value="callback">🔙 Call Back</option>
              <option value="order">📋 Order</option>
              <option value="visit">🛒 Visit</option>
            </select>
            <input type="text" x-model="branchTaskNote" placeholder="Note / purpose..." style="width:100%;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:11px;margin-bottom:6px">
            <div style="display:flex;gap:4px">
              <button @click="createBranchTask" :disabled="savingBranch" style="flex:1;padding:6px;background:#059669;color:#fff;border:0;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer" x-text="savingBranch ? '⏳...' : '✅ Create Branch'"></button>
              <button @click="showBranchForm = false" style="padding:6px 10px;background:#e5e7eb;color:#374151;border:0;border-radius:6px;font-size:11px;cursor:pointer">Cancel</button>
            </div>
            <div x-show="branchMsg" style="font-size:11px;padding:4px;margin-top:4px;border-radius:4px" :style="branchMsgType==='error'?'background:#fee2e2;color:#991b1b':'background:#d1fae5;color:#065f46'" x-text="branchMsg"></div>
          </div>
        </div>

        <div class="modal-section">
          <div class="modal-section-title">📋 <span x-text="VISET.__('workflow.activity_log')"></span></div>
          <div class="wf-log">
            <template x-for="entry in log" :key="entry.id">
              <div class="wf-log-item">
                <div class="wf-log-dot" :style="'background:' + (getStateInfo(entry.to_status || entry.from_status)?.color || '#9ca3af')"></div>
                <div class="wf-log-content">
                  <div><span class="wf-log-action" x-text="entry.action || entry.to_status"></span> <span class="wf-log-user" x-text="entry.user_name"></span></div>
                  <div x-show="entry.note" class="wf-log-note" x-text="entry.note"></div>
                  <div class="wf-log-date" x-text="new Date(entry.created_at).toLocaleString()"></div>
                </div>
              </div>
            </template>
            <div x-show="!log.length" style="text-align:center;padding:16px;color:#9ca3af;font-size:12px" x-text="VISET.__('workflow.no_activity')"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/manager.js"></script>
